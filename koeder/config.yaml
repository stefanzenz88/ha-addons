name: "Netz-Köder (Honeypot)"
version: "1.0.0"
slug: koeder
description: "Köder-Dienst fürs Heimnetz: meldet jeden Verbindungsversuch auf Ports, die niemand benutzen sollte, an Home Assistant"
url: "https://github.com/stefanzenz88/ha-addons"
arch:
  - amd64
  - aarch64
init: false
host_network: true
startup: services
boot: auto
options:
  ports:
    - 21
    - 23
    - 445
    - 1433
    - 2222
    - 3389
    - 5900
  webhook_url: ""
  ignore:
    - "127.0.0.1"
  cooldown_seconds: 300
schema:
  ports:
    - port
  webhook_url: str?
  ignore:
    - str
  cooldown_seconds: int(10,86400)
