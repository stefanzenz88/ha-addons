name: "Netz-RADIUS"
version: "1.3.0"
slug: radius
description: "RADIUS-Server (FreeRADIUS) für die MAC-Authentifizierung der Switch-Ports und WLAN-802.1X (WPA-Enterprise) – freigegebene Geräte kommen aus dem Geräte-Inventar in Home Assistant"
url: "https://github.com/stefanzenz88/ha-addons"
arch:
  - amd64
  - aarch64
init: false
host_network: true
homeassistant_api: true
startup: services
boot: auto
map:
  - share:rw

options:
  radius_secret: ""
  switches:
    - "10.0.0.220=switchkeller2"
    - "10.0.0.221=SW-Dachboden"
  sync_sekunden: 60
  nac_webhook_url: ""
  audit_url: "http://127.0.0.1:8097/api/audit"
  message_authenticator_pflicht: true
  wlan_aps:
    - "10.0.0.210=AP-Gartenhuette"
    - "10.0.0.211=AP-Buero"
    - "10.0.0.212=AP-Dachboden"
    - "10.0.0.213=AP-EG2"
    - "10.0.0.214=AP-Keller"
  wlan_secret: ""
  wlan_benutzer: []
  profil_port: 8098
  profil_ssid: "Zenz-Test"
  profil_url: "http://10.0.0.245:8098/"
  gast_kennwort_stunden: 24
  smtp_server: ""
  smtp_port: 587
  smtp_benutzer: ""
  smtp_passwort: ""
  smtp_absender: ""
schema:
  radius_secret: password
  switches:
    - str
  sync_sekunden: int(15,3600)
  nac_webhook_url: str?
  audit_url: str?
  message_authenticator_pflicht: bool
  wlan_aps:
    - str
  wlan_secret: password?
  wlan_benutzer:
    - name: match(^[a-zA-Z0-9][a-zA-Z0-9._-]{0,31}$)
      passwort: password
  profil_port: port
  profil_ssid: str
  profil_url: str?
  gast_kennwort_stunden: int(1,720)
  smtp_server: str?
  smtp_port: port
  smtp_benutzer: str?
  smtp_passwort: password?
  smtp_absender: str?
